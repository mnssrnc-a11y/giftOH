; Extra PHP settings for the local dev server (serve.cmd and the preview in .claude/launch.json).
; OPcache keeps compiled PHP in memory, so each page no longer recompiles the whole framework
; (about 0.3 s saved per request). Timestamps are checked on every request, so code edits show
; up immediately. XAMPP's own php.ini is not changed.
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
