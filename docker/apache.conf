# Laravel's public/ folder is the web root. ${PORT} comes from the host (Render sets it).
Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Uploaded documents can be up to 10 MB each, several per request.
    LimitRequestBody 104857600

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
